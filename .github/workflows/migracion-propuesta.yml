name: Migracion 1 - propuesta

# Manual. Recorre 00_MIGRACION y deja en 02_REVISION_MIGRACION una hoja con
# el nombre sugerido para cada archivo. No mueve ni renombra nada.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etl-drive
  cancel-in-progress: false

jobs:
  propuesta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRIVE_RAIZ_ID: ${{ secrets.DRIVE_RAIZ_ID }}
      TABLA_MAESTRA_ID: ${{ secrets.TABLA_MAESTRA_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m etl migracion-propuesta
