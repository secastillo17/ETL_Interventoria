name: Respaldo semanal

# Domingos a las 8:13 p. m. hora de Colombia. Verifica que lo oficial siga
# intacto (md5) y guarda la base en 98_RESPALDOS. La copia fuera de Google
# es la descarga mensual con Google Takeout (docs/operacion.md).
on:
  schedule:
    - cron: "13 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etl-drive
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRIVE_RAIZ_ID: ${{ secrets.DRIVE_RAIZ_ID }}
      TABLA_MAESTRA_ID: ${{ secrets.TABLA_MAESTRA_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Integridad y respaldo
        # El .zip queda solo en 98_RESPALDOS de Drive. No se guarda como
        # artefacto de GitHub porque el repositorio es público.
        run: python -m etl respaldo
