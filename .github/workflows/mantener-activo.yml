name: Mantener activo

# En un repositorio publico GitHub apaga los workflows programados tras 60 dias
# sin actividad. Este workflow deja una marca el dia 1 de cada mes para que la
# ETL diaria y el respaldo nunca se detengan.
on:
  schedule:
    - cron: "23 14 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  marca:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Registrar actividad
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > .github/ultima_actividad.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ultima_actividad.txt
          git commit -m "Marca de actividad mensual [skip ci]" || echo "Sin cambios"
          git push
